<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0a0e17" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.35; }
      50% { transform: scale(1.15); opacity: 0.55; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    @keyframes waveMove {
      0% { transform: translateX(0); }
      50% { transform: translateX(-35px); }
      100% { transform: translateX(0); }
    }
    @keyframes radarSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes barGrow {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.78); }
    }

    .orb-glow {
      animation: pulseOrb 6s ease-in-out infinite;
      transform-origin: center;
    }
    .float-card-1 {
      animation: floatCard1 5s ease-in-out infinite;
    }
    .float-card-2 {
      animation: floatCard2 6s ease-in-out infinite;
    }
    .radar-circle {
      animation: radarSpin 18s linear infinite;
      transform-origin: 1040px 180px;
    }
    .wave-line {
      animation: waveMove 8s ease-in-out infinite;
    }
    .bar-anim-1 {
      animation: barGrow 4s ease-in-out infinite;
      transform-origin: bottom;
    }
    .bar-anim-2 {
      animation: barGrow 4.5s ease-in-out infinite reverse;
      transform-origin: bottom;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Background Animated Glowing Orbs (Deep Layer) -->
  <circle cx="150" cy="80" r="140" fill="#38bdf8" filter="url(#glow)" class="orb-glow" />
  <circle cx="1060" cy="270" r="160" fill="#6366f1" filter="url(#glow)" class="orb-glow" style="animation-delay: -3s;" />
  <circle cx="650" cy="320" r="100" fill="#a855f7" opacity="0.2" filter="url(#glow)" />

  <!-- Dynamic Wave Flows in Background -->
  <g class="wave-line" opacity="0.22">
    <path d="M-50,280 C200,240 380,320 600,270 C820,220 980,300 1250,250" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,6" />
    <path d="M-50,300 C220,260 400,340 620,290 C840,240 1000,320 1250,270" fill="none" stroke="#818cf8" stroke-width="2" />
  </g>

  <!-- Right Decorative Geometric Graphic (360 Degree Feedback Radar in background) -->
  <g opacity="0.45">
    <g class="radar-circle">
      <circle cx="1040" cy="180" r="110" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />
      <circle cx="1040" cy="180" r="75" fill="none" stroke="#475569" stroke-width="1.5" />
      <circle cx="1040" cy="180" r="40" fill="none" stroke="#64748b" stroke-width="1" />
      <line x1="1040" y1="70" x2="1040" y2="290" stroke="#334155" stroke-width="1.5" />
      <line x1="930" y1="180" x2="1150" y2="180" stroke="#334155" stroke-width="1.5" />
      <!-- Radar Polygon -->
      <polygon points="1040,100 1110,150 1080,230 990,210 980,140" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="2" />
      <circle cx="1040" cy="100" r="4" fill="#38bdf8" />
      <circle cx="1110" cy="150" r="4" fill="#818cf8" />
      <circle cx="1080" cy="230" r="4" fill="#c084fc" />
      <circle cx="990" cy="210" r="4" fill="#34d399" />
      <circle cx="980" cy="140" r="4" fill="#38bdf8" />
    </g>
  </g>

  <!-- Floating Dynamic Pill 1 (Continuous Feedback) -->
  <g class="float-card-1" filter="url(#subtleShadow)">
    <rect x="880" y="42" width="220" height="46" rx="23" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="906" cy="65" r="9" fill="#10b981" />
    <path d="M902 65 L905 68 L911 62" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" />
    <text x="924" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Continuous 360° Loop</text>
  </g>

  <!-- Floating Dynamic Pill 2 (Goal & Performance Tracking) -->
  <g class="float-card-2" filter="url(#subtleShadow)">
    <rect x="830" y="275" width="230" height="46" rx="23" fill="#1e293b" fill-opacity="0.85" stroke="#818cf8" stroke-width="1.5" />
    <circle cx="856" cy="298" r="9" fill="#818cf8" />
    <text x="852" y="302" font-family="sans-serif" font-size="12" fill="#fff" font-weight="bold">★</text>
    <text x="874" y="303" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">AI-Augmented Appraisals</text>
  </g>

  <!-- Foreground Title and Content (Solid, Crisp, Unobscured) -->
  <g filter="url(#subtleShadow)">
    <!-- Top Pill Category -->
    <rect x="70" y="45" width="280" height="34" rx="17" fill="url(#badgeGrad)" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="88" cy="62" r="5" fill="#38bdf8" />
    <text x="103" y="67" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#93c5fd" letter-spacing="1">CURATED AWESOME LIST</text>

    <!-- Main Title -->
    <text x="70" y="140" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5">
      Awesome Performance Review
    </text>
    <text x="70" y="195" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="#f8fafc">
      &amp; Feedback Management
    </text>

    <!-- Subtitle / Tagline -->
    <text x="72" y="240" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Top commercial SaaS suites, market intelligence &amp; self-hosted open-source software
    </text>

    <!-- Core Badges / Tags -->
    <g transform="translate(70, 268)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="132" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="14" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">🎯 360 Reviews</text>

      <!-- Tag 2 -->
      <rect x="142" y="0" width="138" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="156" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#818cf8">💬 Real-time Pulse</text>

      <!-- Tag 3 -->
      <rect x="290" y="0" width="138" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="304" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#34d399">🚀 OKRs &amp; Goals</text>

      <!-- Tag 4 -->
      <rect x="438" y="0" width="150" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="452" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#f472b6">🔒 Self-Hosted OS</text>
    </g>
  </g>
</svg>